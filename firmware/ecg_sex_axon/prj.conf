CONFIG_NRF_AXON=y

# Must be >= NRF_AXON_MODEL_ECG_SEX_V3_MAX_IL_BUFFER_USED in the generated model header
CONFIG_NRF_AXON_INTERLAYER_BUFFER_SIZE=323072

# The model is compiled without the partial sum buffer
CONFIG_NRF_AXON_PSUM_BUFFER_SIZE=0

CONFIG_FPU=y
CONFIG_LOG=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_MAIN_STACK_SIZE=4096
