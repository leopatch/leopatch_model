CONFIG_ADC=y
CONFIG_GPIO=y
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_NRF_AXON=y
# Must be >= NRF_AXON_MODEL_ECG_SEX_BEAT_MAX_IL_BUFFER_USED in the generated model header
CONFIG_NRF_AXON_INTERLAYER_BUFFER_SIZE=52736
# The model is compiled without the partial sum buffer
CONFIG_NRF_AXON_PSUM_BUFFER_SIZE=0

CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_MAIN_STACK_SIZE=4096
# 1 us kernel ticks, so the 2000 us sample period (500 Hz) is exact and the notch filters line up with the hum
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000000

# Bluetooth upload (Button 1): Nordic UART Service, one connection, no pairing yet
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="LeoPatch"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_NUS=y
# Test setup: no pairing (BT_NUS_AUTHEN off), so anyone nearby can connect and read the recording.
# Turn on pairing and encryption before real use.
# Bigger packets so the 5 s recording uploads in about a second
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
