# TensorFlow Lite Micro (same base options as Zephyr's samples/modules/tflite-micro/hello_world)
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_REQUIRES_FLOAT_PRINTF=y
CONFIG_MAIN_STACK_SIZE=32768

# We drive the console UART ourselves with a binary protocol, so switch the console off.
CONFIG_SERIAL=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Optional, once the build works: ARM's optimized int8 kernels (several times faster than the
# reference kernels). Needs the cmsis-nn module in your west workspace, see README.md.
# CONFIG_TENSORFLOW_LITE_MICRO_CMSIS_NN_KERNELS=y

# A CPU fault is reported by k_sys_fatal_error_handler() in main.cc (it prints a FAULT line, then reboots).
# (Do NOT set CONFIG_RESET_ON_FATAL_ERROR: NCS then links its own handler and the two clash.)
CONFIG_REBOOT=y
