# --- Axon NPU (nRF54LM20B) ---------------------------------------------------------------------------
CONFIG_NCS_SAMPLES_DEFAULTS=y
CONFIG_NRF_AXON=y
# Interlayer (scratch) RAM the Axon needs, in BYTES. The compiler reported:
#   w50_b10 -> 49000    w25 -> 32640    (the build fails with a static_assert if this is too small)
CONFIG_NRF_AXON_INTERLAYER_BUFFER_SIZE=49000
CONFIG_NRF_AXON_PSUM_BUFFER_SIZE=0

# --- which model: pick ONE (w50_b10 is the default) ---------------------------------------------------
# CONFIG_ECG_MODEL_W25=y

# --- the console UART carries OUR binary protocol, so switch every console/log user off ----------------
CONFIG_SERIAL=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_MAIN_STACK_SIZE=4096

# A CPU fault is reported by k_sys_fatal_error_handler() in main.c (prints a FAULT line, then reboots).
# (Do NOT set CONFIG_RESET_ON_FATAL_ERROR: NCS then links its own handler and the two clash.)
CONFIG_REBOOT=y
